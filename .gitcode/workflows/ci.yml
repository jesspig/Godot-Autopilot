name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch: {}

stages:
  verify:
    name: Linux verify
    jobs:
      linux-debug:
        name: Linux Debug
        runs-on: [ubuntu-latest, x64, medium]
        timeout-minutes: 90
        env:
          CI: "true"
        steps:
          - name: Checkout
            uses: checkout
          - name: Install Bun
            run: |
              curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
              "$HOME/.bun/bin/bun" --version
              echo "$HOME/.bun/bin" >> "$ATOMGIT_PATH"
          - name: Initialize submodules
            run: git submodule update --init --recursive
          - name: Install CLI dependencies
            run: bun install --frozen-lockfile
          - name: Install Ninja
            run: sudo apt-get update && sudo apt-get install -y ninja-build
          - name: No-Python guard
            run: bun tests/guard/no_python_guard.ts
          - name: Configure
            run: cmake --preset debug
          - name: Build
            run: cmake --build --preset debug
          - name: Tests
            run: ctest --preset debug --output-on-failure
          - name: CLI tests
            run: bun test cli/tests
          - name: Typecheck
            run: bun run typecheck
