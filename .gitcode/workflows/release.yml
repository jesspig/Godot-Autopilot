name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. 0.3.3 or v0.3.3)"
        required: true
        type: string

permissions:
  repository: write

stages:
  release:
    name: Build and publish
    jobs:
      cli:
        name: CLI binaries
        runs-on: [ubuntu-latest, x64, medium]
        timeout-minutes: 60
        env:
          INPUT_TAG: ${{ inputs.tag }}
        steps:
          - name: Checkout
            uses: checkout
          - name: Install Bun
            run: |
              curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
              "$HOME/.bun/bin/bun" --version
              echo "$HOME/.bun/bin" >> "$ATOMGIT_PATH"
          - name: Install dependencies
            run: bun install --frozen-lockfile
          - name: Validate version
            run: |
              if [ -n "$INPUT_TAG" ]; then
                tag="$INPUT_TAG"
              else
                tag="${ATOMGIT_REF#refs/tags/}"
              fi
              tag="${tag#v}"
              version="$(tr -d ' \t\r\n' < VERSION)"
              if [ "$tag" != "$version" ]; then
                echo "tag $tag does not match VERSION $version"
                exit 1
              fi
          - name: Build CLI binaries
            run: |
              set -euo pipefail
              version="$(tr -d ' \t\r\n' < VERSION)"
              mkdir -p dist
              bun build cli/bin/gda.ts --compile --minify --target=bun-windows-x64 --outfile dist/gda.exe
              zip -j "dist/gda-${version}-windows-x64.zip" dist/gda.exe
              bun build cli/bin/gda.ts --compile --minify --target=bun-linux-x64 --outfile dist/gda
              tar -czf "dist/gda-${version}-linux-x64.tar.gz" -C dist gda
              bun build cli/bin/gda.ts --compile --minify --target=bun-linux-x64-musl --outfile dist/gda-musl
              tar -czf "dist/gda-${version}-linux-x64-musl.tar.gz" -C dist gda-musl
              bun build cli/bin/gda.ts --compile --minify --target=bun-darwin-arm64 --outfile dist/gda-darwin-arm64
              tar -czf "dist/gda-${version}-macos-arm64.tar.gz" -C dist gda-darwin-arm64
              bun build cli/bin/gda.ts --compile --minify --target=bun-darwin-x64 --outfile dist/gda-darwin-x64
              tar -czf "dist/gda-${version}-macos-x64.tar.gz" -C dist gda-darwin-x64
              rm -f dist/gda dist/gda-musl dist/gda-darwin-arm64 dist/gda-darwin-x64 dist/gda.exe
              sha256sum dist/gda-* > dist/sha256sums.txt
              cat dist/sha256sums.txt
          - name: Publish AtomGit Release
            run: |
              if [ -n "$INPUT_TAG" ]; then
                tag="$INPUT_TAG"
              else
                tag="${ATOMGIT_REF#refs/tags/}"
              fi
              bun tools/publish_atomgit.ts --dir dist --tag "$tag" \
                --repo "$ATOMGIT_REPOSITORY" --api "https://api.gitcode.com/api/v5"
