name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      # 开发链只允许 Bun + CMake + 编译器；本作业不安装 Python。
      - name: No-Python guard
        run: bun tests/guard/no_python_guard.ts

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      # typecheck 为纯静态检查，三平台结果一致，仅 ubuntu 执行省时
      - name: CLI typecheck
        if: matrix.os == 'ubuntu-latest'
        run: bun run typecheck

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure libgcc_s link (Linux)
        if: runner.os == 'Linux'
        run: |
          so1="$(find /usr/lib/gcc/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu -name 'libgcc_s.so.1' 2>/dev/null | head -n1)"
          if [ -n "$so1" ]; then sudo ln -sf "$so1" /usr/lib/x86_64-linux-gnu/libgcc_s.so; fi

      # 子模块版本由 gitlink（160000 mode）记录，.gitmodules 文本不变时 commit 仍可能
      # 升级，故 cache key 取自 git ls-files 的权威 sha，避免命中旧源码缓存。
      - name: Resolve submodule commits
        id: submodules
        shell: bash
        run: echo "shas=$(git ls-files -s third_party | awk '{print $2}' | sort | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache third_party submodules
        uses: actions/cache@v4
        with:
          path: |
            third_party/godot-cpp
            third_party/mcp-cpp-sdk
            third_party/googletest
          key: submodules-debug-${{ runner.os }}-${{ steps.submodules.outputs.shas }}

      - name: Build (Debug)
        run: bun run gda-dev-tools build

      # 打包完整性自检：单平台 CI 无法交叉编译，用本地产物复制成三平台库名
      # 验证打包收集逻辑（三平台库齐备、6 个 C# 桥 .cs 入包、.pdb 不入包、
      # gdextension 与包内文件一一对应）。
      - name: Package integrity self-check
        shell: bash
        run: |
          set -euo pipefail
          native="$(find build -type f \( -name 'godot-autopilot.dll' -o -name 'libgodot-autopilot.so' -o -name 'libgodot-autopilot.dylib' \) | head -n1)"
          if [ -z "$native" ]; then
            echo "::error::no built platform library found under build/"
            exit 1
          fi
          mkdir -p dist/pkg-libs
          for name in godot-autopilot.dll libgodot-autopilot.so libgodot-autopilot.dylib; do
            cp "$native" "dist/pkg-libs/$name"
          done
          bun run gda-dev-tools package --libs-dir dist/pkg-libs
          bun run gda-dev-tools package-check dist/godot-autopilot-*.zip

      # 分层执行：守卫（零依赖秒级）→ 单元 → 边界 → 集成 → CLI。
      # 分层只为失败时能一眼定位到层；全量默认门 = 这五层之和。
      - name: Guards
        run: ctest --preset debug -L guard --output-on-failure

      - name: Unit and boundary tests
        run: ctest --preset debug -L "unit|boundary" --output-on-failure

      - name: Integration tests
        run: ctest --preset debug -L integration --output-on-failure

      - name: CLI tests
        run: ctest --preset debug -L cli --output-on-failure

      # 注册点守恒：任一层筛不出用例或被静默丢弃时在此暴露
      - name: Test inventory guard
        shell: bash
        run: |
          set -euo pipefail
          total="$(ctest --preset debug -N | sed -n 's/^Total Tests: //p')"
          if [ -z "$total" ] || [ "$total" -lt 900 ]; then
            echo "::error::ctest inventory dropped to ${total:-<none>} (expected >= 900)"
            exit 1
          fi
          echo "ctest inventory: $total"

  # 可执行文件冒烟：只验证 `bun build --compile` 在三平台都能产出并启动，不发布。
  # 发布产物由 release.yml 的 cli 作业构建（含 macOS ad-hoc 签名与校验和）。
  cli-bins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Build standalone gda
        shell: bash
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          out="dist/gda-${version}-${{ matrix.os }}"
          case "${{ matrix.os }}" in windows*) out="${out}.exe";; esac
          mkdir -p dist
          bun build cli/bin/gda.ts --compile --minify --outfile "$out"
          echo "GDA_BIN=${out}" >> "$GITHUB_ENV"

      - name: Smoke test
        shell: bash
        run: |
          chmod +x "$GDA_BIN" || true
          "$GDA_BIN" --version
          "$GDA_BIN" list
