name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      SCCACHE_GHA_ENABLED: "true"
      # Windows runner 控制台为 cp1252，保证 Python 子进程（含 embed_skills.py）以 UTF-8 输出
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      # typecheck 为纯静态检查，三平台结果一致，仅 ubuntu 执行省时
      - name: CLI typecheck
        if: matrix.os == 'ubuntu-latest'
        run: bun run typecheck

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure libgcc_s link (Linux)
        if: runner.os == 'Linux'
        run: |
          so1="$(find /usr/lib/gcc/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu -name 'libgcc_s.so.1' 2>/dev/null | head -n1)"
          if [ -n "$so1" ]; then sudo ln -sf "$so1" /usr/lib/x86_64-linux-gnu/libgcc_s.so; fi

      # 子模块版本由 gitlink（160000 mode）记录，.gitmodules 文本不变时 commit 仍可能
      # 升级，故 cache key 取自 git ls-files 的权威 sha，避免命中旧源码缓存。
      - name: Resolve submodule commits
        id: submodules
        shell: bash
        run: echo "shas=$(git ls-files -s third_party | awk '{print $2}' | sort | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache third_party submodules
        uses: actions/cache@v4
        with:
          path: |
            third_party/godot-cpp
            third_party/mcp-cpp-sdk
            third_party/googletest
          key: submodules-debug-${{ runner.os }}-${{ steps.submodules.outputs.shas }}

      - name: Build (Debug)
        run: python main.py build

      - name: L1 unit tests
        run: ctest --preset debug -E "^gda_runner_" --output-on-failure
