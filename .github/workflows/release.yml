name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION v${version}"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-release-${{ runner.os }}-${{ hashFiles('cmake/FetchDependencies.cmake') }}

      - name: Build (Release)
        run: python build.py --release

      - name: Upload platform library
        uses: actions/upload-artifact@v4
        with:
          name: gdext-${{ runner.os }}
          path: |
            Example/addons/godot-autopilot/godot-autopilot.dll
            Example/addons/godot-autopilot/libgodot-autopilot.so
            Example/addons/godot-autopilot/libgodot-autopilot.dylib
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: gdext-*
          path: dist

      - name: Package addons.zip
        run: |
          python build.py --package --libs-dir dist
          mv dist/godot-autopilot-*.zip addons.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: addons.zip
