name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. 0.2.5 or v0.2.5)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches VERSION
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          tag="${TAG_NAME}"
          tag="${tag#v}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match VERSION ${version} (v prefix optional)"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: No-Python guard
        run: bun tests/guard/no_python_guard.ts

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure libgcc_s link (Linux)
        if: runner.os == 'Linux'
        run: |
          so1="$(find /usr/lib/gcc/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu -name 'libgcc_s.so.1' 2>/dev/null | head -n1)"
          if [ -n "$so1" ]; then sudo ln -sf "$so1" /usr/lib/x86_64-linux-gnu/libgcc_s.so; fi

      # 子模块版本由 gitlink（160000 mode）记录，.gitmodules 文本不变时 commit 仍可能
      # 升级，故 cache key 取自 git ls-files 的权威 sha，避免命中旧源码缓存。
      - name: Resolve submodule commits
        id: submodules
        shell: bash
        run: echo "shas=$(git ls-files -s third_party | awk '{print $2}' | sort | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache third_party submodules
        uses: actions/cache@v4
        with:
          path: |
            third_party/godot-cpp
            third_party/mcp-cpp-sdk
            third_party/googletest
          key: submodules-release-${{ runner.os }}-${{ steps.submodules.outputs.shas }}

      - name: Build (Release)
        shell: bash
        run: |
          set -o pipefail
          bun run gda-dev-tools build --release 2>&1 | tee build-release.log
          grep -E '\[gda\] LTO: (thin|LTCG|full)' build-release.log || {
            echo "::error::Release build log has no LTO record (expected '[gda] LTO: thin|LTCG|full')"
            exit 1
          }

      - name: Deploy to example projects
        run: bun run gda-dev-tools deploy --release

      - name: Upload platform library
        uses: actions/upload-artifact@v4
        with:
          name: gdext-${{ runner.os }}
          path: |
            examples/2d_dodge_the_creeps/addons/godot-autopilot/godot-autopilot.dll
            examples/2d_dodge_the_creeps/addons/godot-autopilot/libgodot-autopilot.so
            examples/2d_dodge_the_creeps/addons/godot-autopilot/libgodot-autopilot.dylib
          if-no-files-found: error

  # gda CLI 独立可执行文件：单个自包含二进制（内嵌 Bun 运行时），供没装 Bun / Node 的用户
  # 直接下载使用。产物名带版本与目标：gda-<version>-<asset>.{zip,tar.gz}。
  # macOS 交叉编译产物必须 ad-hoc 签名，否则 Apple Silicon 内核会直接终止进程。
  cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: bun-windows-x64
            asset: windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: linux-x64
            ext: ""
          - os: ubuntu-latest
            target: bun-linux-x64-musl
            asset: linux-x64-musl
            ext: ""
          - os: macos-latest
            target: bun-darwin-arm64
            asset: macos-arm64
            ext: ""
          - os: macos-latest
            target: bun-darwin-x64
            asset: macos-x64
            ext: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Build gda binary
        shell: bash
        env:
          GDA_TARGET: ${{ matrix.target }}
          GDA_EXT: ${{ matrix.ext }}
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          mkdir -p dist
          out="dist/gda${GDA_EXT}"
          bun build cli/bin/gda.ts --compile --minify --target="${GDA_TARGET}" --outfile "$out"
          chmod +x "$out" 2>/dev/null || true
          if [[ "${GDA_TARGET}" == *musl* ]]; then
            built="$(docker run --rm -v "${GITHUB_WORKSPACE}/dist:/dist:ro" alpine:3.20 sh -c 'apk add --no-cache libstdc++ >/dev/null 2>&1 && /dist/gda --version' | awk '{print $2}')"
          else
            built="$("$out" --version | awk '{print $2}')"
          fi
          if [ "${built}" != "${version}" ]; then
            echo "::error::Built gda reports version '${built}' but VERSION is '${version}'"
            exit 1
          fi

      - name: Ad-hoc sign (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --force --sign - "dist/gda${{ matrix.ext }}"
          codesign -dvv "dist/gda${{ matrix.ext }}" 2>&1 | head -5

      - name: Verify binary runs
        shell: bash
        env:
          GDA_TARGET: ${{ matrix.target }}
          GDA_EXT: ${{ matrix.ext }}
        run: |
          if [[ "${GDA_TARGET}" == *musl* ]]; then
            docker run --rm -v "${GITHUB_WORKSPACE}/dist:/dist:ro" alpine:3.20 sh -c '
              set -e
              apk add --no-cache libstdc++ >/dev/null 2>&1
              /dist/gda --version
              /dist/gda list'
          else
            chmod +x "dist/gda${GDA_EXT}" || true
            "dist/gda${GDA_EXT}" --version
            "dist/gda${GDA_EXT}" list
          fi

      - name: Package
        shell: bash
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          name="gda-${version}-${{ matrix.asset }}"
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/gda.exe' -DestinationPath 'dist/${name}.zip' -Force"
          else
            tar -czf "dist/${name}.tar.gz" -C dist gda
            rm -f dist/gda
          fi
          ls -l dist

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gda-${{ matrix.asset }}
          path: |
            dist/gda-*.zip
            dist/gda-*.tar.gz
          if-no-files-found: error

  package:
    needs: [build, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Download platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: gdext-*
          path: dist

      # CLI 产物单独放，避免污染 --libs-dir dist 的三平台库收集
      - name: Download CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: gda-*
          path: cli-dist
          merge-multiple: true

      - name: Package addons.zip
        run: bun run gda-dev-tools package --libs-dir dist

      # 自检失败即中止发布：残缺包不得挂到 GitHub Release
      - name: Verify package integrity
        run: bun run gda-dev-tools package-check dist/godot-autopilot-*.zip

      - name: Stage addons.zip
        run: mv dist/godot-autopilot-*.zip addons.zip

      - name: Checksums
        run: |
          cd cli-dist
          sha256sum gda-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            addons.zip
            cli-dist/gda-*
            cli-dist/sha256sums.txt

      - name: Mirror to AtomGit
        env:
          GDA_ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          GDA_ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$GDA_ATOMGIT_TOKEN" ] || [ -z "$GDA_ATOMGIT_REPO" ]; then
            echo "AtomGit credentials are not configured; skipping mirror."
            exit 0
          fi
          mkdir -p atomgit-dist
          cp addons.zip atomgit-dist/
          cp cli-dist/* atomgit-dist/
          bun tools/mirror_atomgit.ts --dir atomgit-dist --tag "$TAG_NAME"
